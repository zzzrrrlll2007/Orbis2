name: build-zoe-debug

# Cloud build for the Zoe (org.orbis.zoe) variant.
# Publishes the arm64 debug APK to a public prerelease so it can be downloaded
# straight from a phone browser, without signing in or visiting the Actions page.

on:
  push:
    branches:
      - 'zoe/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: zoe-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assemble-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # third_party/ ships through .gitmodules; a shallow checkout without
          # submodules fails at configuration time.
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # web/build.gradle.kts runs `pnpm run build` in web-ui/ for :web:buildWebUi,
      # which is a dependency of :app:preBuild. Without Node + pnpm the build dies
      # immediately with "Could not start 'pnpm'".
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Install web-ui dependencies
        working-directory: web-ui
        run: pnpm install --frozen-lockfile

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Assemble debug APK
        env:
          GRADLE_OPTS: >-
            -Dorg.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g
            -Dorg.gradle.parallel=true
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Pick arm64 APK
        id: apk
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/debug -name '*arm64-v8a*debug.apk' | head -n 1)
          if [ -z "$APK" ]; then APK=$(find app/build/outputs/apk/debug -name '*.apk' | head -n 1); fi
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          ls -lh "$APK"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: orbis-zoe-debug-arm64
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 14

      # Public download link: no GitHub login, works from a phone browser.
      - name: Publish to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="zoe-debug"
          TITLE="Zoe 调试包（水彩玻璃 · arm64）"
          NOTES="自动构建 ${GITHUB_SHA::7} · 包名 org.orbis.zoe.dev · 桌面名 Orbis Dev · 与官方 Orbis 共存"
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" "${{ steps.apk.outputs.path }}" \
            --prerelease --title "$TITLE" --notes "$NOTES" \
            --target "$GITHUB_SHA"
          echo "### 下载地址" >> "$GITHUB_STEP_SUMMARY"
          echo "https://github.com/${{ github.repository }}/releases/download/$TAG/$(basename ${{ steps.apk.outputs.path }})" >> "$GITHUB_STEP_SUMMARY"
