name: build-zoe-debug

# Cloud build for the Zoe (org.orbis.zoe) variant.
# The repo has no existing .github/ directory: this file is added from scratch.
# Debug builds need no signing secrets, so this runs on a fork with default settings.

on:
  push:
    branches:
      - 'zoe/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zoe-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assemble-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # third_party/ ships through .gitmodules; a shallow checkout without
          # submodules fails at configuration time.
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # web/build.gradle.kts runs `pnpm run build` in web-ui/ for :web:buildWebUi,
      # which is a dependency of :app:preBuild. Without Node + pnpm the build dies
      # immediately with "Could not start 'pnpm'".
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Install web-ui dependencies
        working-directory: web-ui
        run: pnpm install --frozen-lockfile

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Gradle info
        run: |
          chmod +x ./gradlew
          ./gradlew --version

      - name: Assemble debug APK
        env:
          GRADLE_OPTS: >-
            -Dorg.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g
            -Dorg.gradle.parallel=true
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Locate APK
        id: apk
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/debug -name '*.apk' | head -n 1)
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: orbis-zoe-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
